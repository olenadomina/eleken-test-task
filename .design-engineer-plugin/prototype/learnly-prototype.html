<meta charset="utf-8">
<title>Learnly prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens map 1:1 to the Figma variables (see design/dev/design-system.md) */
:root{
  --paper:#F6F6F3; --sheet:#FFFFFF; --margin:#F1F0EC; --violet-wash:#EEEBFF;
  --rule:#E6E4DE; --rule-strong:#D3D0C8;
  --ink:#1A1A19; --pencil:#5F5E5A; --pencil-faded:#8C8B86; --on-violet:#FFFFFF;
  --ink-violet:#5B47E0; --ink-violet-deep:#4A37C9;
  --red-pen:#C8322B; --red-wash:#FDECEA;
  --highlighter:#A15C07; --highlighter-wash:#FEF3E2;
  --approved:#1D7A4A; --approved-wash:#E6F4EC;
  --note-blue:#2563C9; --note-wash:#E8F0FC;
  --night:#1A1A19;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --lift:0 8px 24px rgba(26,26,25,.14);
  --lift-strong:0 16px 40px rgba(26,26,25,.22);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:20px;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;color-scheme:light}
#app{height:100%;overflow-x:auto;overflow-y:hidden}
.app{min-width:1280px}
.narrow{display:none;padding:10px 16px;background:var(--night);color:#fff;font-size:13px;line-height:18px}
@media (max-width:1279px){.narrow{display:block}#app{height:calc(100% - 38px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none;display:block}
:focus-visible{outline:2px solid var(--ink-violet);outline-offset:2px;border-radius:6px}

/* Type */
.h1{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.5px;margin:0}
.h2{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.3px;margin:0}
.h3{font-size:16px;line-height:24px;font-weight:600;letter-spacing:-.1px;margin:0}
.m{font-size:14px;line-height:20px}
.s{font-size:13px;line-height:18px}
.c{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.1px}
.o{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.med{font-weight:500}.semi{font-weight:600}
.pencil{color:var(--pencil)}.faded{color:var(--pencil-faded)}.violet{color:var(--ink-violet-deep)}
.red{color:var(--red-pen)}.amber{color:var(--highlighter)}.green{color:var(--approved)}.blue{color:var(--note-blue)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.gap2{gap:2px}.gap4{gap:4px}.gap10{gap:10px}.gap14{gap:14px}.gap32{gap:32px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}.gap24{gap:24px}
.grow{flex:1;min-width:0}.between{justify-content:space-between}
.hide{display:none!important}

/* App shell */
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:20px 16px;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--ink-violet);display:grid;place-items:center;color:#fff}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--pencil);font-size:13px;line-height:18px;transition:background .15s}
.nav:hover{background:var(--margin)}
.nav.on{background:var(--violet-wash);color:var(--ink-violet-deep);font-weight:500}
.nav .badge-n{margin-left:auto;font-size:12px;font-weight:500;line-height:16px;padding:1px 7px;border-radius:999px;background:var(--margin);color:var(--pencil)}
.nav.on .badge-n{background:var(--ink-violet);color:#fff}
.nav .badge-n.alert{background:var(--red-wash);color:var(--red-pen)}
.role{margin-top:auto;background:var(--margin);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--rule)}
.seg.light{background:var(--margin)}
.seg button{flex:1;padding:6px 12px;border-radius:6px;color:var(--pencil);font-size:13px;line-height:18px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg button.on{background:var(--sheet);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.auto button{flex:none}
.main{overflow:auto;position:relative}
.page{padding:20px 40px 48px;display:flex;flex-direction:column;gap:24px;max-width:1240px}
.topbar{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;height:38px;width:360px;padding:0 12px;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;color:var(--pencil-faded)}
.search input{border:0;outline:0;background:none;flex:1;font-size:13px}
.kbd{font-size:12px;line-height:16px;font-weight:500;color:var(--pencil-faded);border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.iconbtn{width:38px;height:38px;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;display:grid;place-items:center;color:var(--pencil);position:relative}
.iconbtn.sm{width:32px;height:32px;border-radius:8px}
.iconbtn:hover{background:var(--margin)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--note-blue);border:2px solid var(--sheet)}
.avatar{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.av28{width:28px;height:28px;font-size:12px;font-weight:500}
.av24{width:24px;height:24px;font-size:12px;font-weight:500}
.av22{width:22px;height:22px;font-size:12px;font-weight:500}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;line-height:18px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn-primary{background:var(--ink-violet);color:#fff}
.btn-primary:hover{background:var(--ink-violet-deep)}
.btn-secondary{background:var(--sheet);border:1px solid var(--rule-strong);padding:7px 13px}
.btn-secondary:hover{background:var(--margin)}
.btn-ghost{color:var(--ink-violet-deep);padding:8px 6px}
.btn-ghost:hover{text-decoration:underline}
.btn-danger{background:var(--red-pen);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 12px}.btn-secondary.btn-sm{padding:5px 11px}
.link{color:var(--ink-violet-deep);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}

/* Cards, badges */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg)}
.pad{padding:20px}.pad24{padding:24px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.b-needs{background:var(--highlighter-wash);color:var(--highlighter)}
.b-resub{background:var(--violet-wash);color:var(--ink-violet-deep)}
.b-changes{background:var(--note-wash);color:var(--note-blue)}
.b-accepted{background:var(--approved-wash);color:var(--approved)}
.b-over{background:var(--red-wash);color:var(--red-pen)}
.b-neutral{background:var(--margin);color:var(--pencil)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;border-radius:999px;background:var(--violet-wash);color:var(--ink-violet-deep);font-size:12px;font-weight:500;line-height:16px}
.typeicon{width:36px;height:36px;border-radius:8px;background:var(--margin);display:grid;place-items:center;color:var(--pencil);flex:none}
.cover{display:block;border-radius:8px;flex:none;position:relative;overflow:hidden}
.bar{height:6px;border-radius:999px;background:var(--margin);overflow:hidden;flex:1}
.bar > b{display:block;height:100%;border-radius:999px;background:var(--ink-violet);transition:width .9s var(--ease)}
.divider{height:1px;background:var(--rule)}

/* Week list */
.wl-group{padding:12px 20px 4px}
.wl-row{display:flex;align-items:center;gap:14px;padding:12px 20px;transition:background .15s}
.wl-row.over{background:var(--red-wash)}
.wl-row.over .typeicon{background:var(--sheet)}
.wl-row.fb{background:var(--note-wash)}
.wl-row.fb .typeicon{background:var(--sheet);color:var(--note-blue)}
.wl-due{flex:0 1 170px;min-width:120px;display:flex;flex-direction:column;gap:2px}
.wl-act{flex:none;min-width:96px;display:flex;justify-content:flex-end}
.cardfoot{display:flex;align-items:center;gap:6px;padding:14px 20px;border-top:1px solid var(--rule)}

/* Tabs */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--rule)}
.tab{display:flex;align-items:center;gap:6px;padding:4px 0 12px;color:var(--pencil);font-size:13px;line-height:18px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);font-weight:500;border-color:var(--ink-violet)}
.count{font-size:12px;line-height:16px;font-weight:500;padding:1px 6px;border-radius:999px;background:var(--margin);color:var(--pencil)}
.tab.on .count{background:var(--violet-wash);color:var(--ink-violet-deep)}
.count.red{background:var(--red-wash);color:var(--red-pen)}

/* Inputs */
.label{font-size:13px;line-height:18px;font-weight:500;display:flex;gap:4px}
.label .req{color:var(--red-pen)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.input{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--sheet);color:var(--pencil-faded);min-width:0}
.input:focus-within{border-color:var(--ink-violet);box-shadow:0 0 0 1px var(--ink-violet)}
.input input,.input select{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink);font-size:14px;height:100%}
.input select{appearance:none;cursor:pointer}
.input.err{border-color:var(--red-pen);box-shadow:0 0 0 1px var(--red-pen)}
.textarea{border:1px solid var(--rule-strong);border-radius:8px;background:var(--sheet);padding:10px 12px;min-height:84px;resize:vertical;outline:0;width:100%;font-size:14px;line-height:20px}
.textarea:focus{border-color:var(--ink-violet);box-shadow:0 0 0 1px var(--ink-violet)}
.hint{font-size:12px;line-height:16px;font-weight:500;color:var(--pencil-faded)}
.errtext{font-size:12px;line-height:16px;font-weight:500;color:var(--red-pen)}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--rule-strong);background:var(--sheet);display:grid;place-items:center;color:#fff;flex:none;cursor:pointer}
.cb.on,.cb.mixed{background:var(--ink-violet);border-color:var(--ink-violet)}
.toggle{width:36px;height:20px;border-radius:999px;background:var(--rule-strong);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.toggle.on{background:var(--ink-violet)}.toggle.on::after{transform:translateX(16px)}
.dropzone{border:1px dashed var(--rule-strong);border-radius:8px;padding:18px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--pencil);font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.dropzone:hover{background:var(--margin);border-color:var(--ink-violet)}
.filerow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}

/* Table (queue) */
.tbl{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.tr{display:flex;align-items:stretch;height:60px;border-bottom:1px solid var(--rule);position:relative;cursor:pointer;transition:background .12s}
.tr:hover{background:#FAFAF8}
.tr.sel{background:var(--violet-wash)}
.tr.active{background:var(--violet-wash);box-shadow:inset 3px 0 0 var(--ink-violet)}
.tr.fail{background:var(--red-wash)}
.tr.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%{background:var(--approved-wash)}100%{background:transparent}}
.tr.head{height:40px;background:var(--margin);cursor:default}
.td{display:flex;align-items:center;gap:8px;padding:0 12px;min-width:0;flex:none}
.td.grow{flex:1}
.overbar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red-pen)}
.tfoot{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px 0 16px}

/* Side panel (non-modal) */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:580px;background:var(--sheet);border-left:1px solid var(--rule);box-shadow:-8px 0 32px rgba(26,26,25,.12);display:flex;flex-direction:column;z-index:30;animation:slidein .28s var(--ease)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.rp-top{display:flex;align-items:center;gap:8px;padding:14px 16px 14px 24px;border-bottom:1px solid var(--rule)}
.rp-body{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.rp-foot{border-top:1px solid var(--rule);padding:18px 24px;display:flex;flex-direction:column;gap:14px;background:var(--sheet)}
.fbbox{border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
.fbpart{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.fbpart textarea{border:0;outline:0;resize:none;width:100%;font-size:14px;line-height:20px;background:none;min-height:40px}
.fbpart:focus-within{box-shadow:inset 0 0 0 2px var(--ink-violet)}

/* Floating */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:16px;box-shadow:var(--lift-strong);z-index:60;font-size:13px;font-weight:500;animation:toastin .3s var(--ease)}
.toast button{color:#BFB7FF;font-weight:600}
@keyframes toastin{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.bulkbar{position:fixed;left:calc(50% + 124px);transform:translateX(-50%);bottom:24px;background:var(--night);color:#fff;border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:4px;box-shadow:var(--lift-strong);z-index:40;font-size:13px}
.bulkbar .bb{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;color:#fff}
.bulkbar .bb:hover{background:rgba(255,255,255,.1)}
.bulkbar .sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 6px}
.menu{position:fixed;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--lift);padding:6px 0;z-index:70;min-width:220px;animation:fadein .15s}
.menu .mi{display:flex;align-items:center;gap:8px;padding:8px 12px;width:100%;text-align:left;font-size:13px}
.menu .mi:hover{background:var(--margin)}
.menu .mgroup{padding:8px 14px 4px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(26,26,25,.45);z-index:80;display:grid;place-items:center;animation:fadein .2s}
.dialog{width:460px;background:var(--sheet);border-radius:14px;padding:24px 24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--lift-strong)}
.alert{display:flex;gap:12px;padding:14px 12px 14px 16px;border-radius:10px}
.alert.danger{background:var(--red-wash);border:1px solid var(--red-pen)}
.alert.info{background:var(--note-wash)}
.alert.ok{background:var(--approved-wash)}
.skel{background:linear-gradient(90deg,var(--margin) 0%,#F8F7F4 50%,var(--margin) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:4px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:72px 24px;text-align:center}
.empty .ei{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.tip{position:relative}
.tip[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);background:var(--night);color:#fff;font-size:12px;line-height:16px;font-weight:500;padding:7px 10px;border-radius:6px;width:max-content;max-width:320px;white-space:normal;z-index:90;box-shadow:var(--lift)}
.kb{display:inline-block;min-width:22px;text-align:center;font-size:12px;font-weight:600;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--sheet)}


@media (max-width:1439px){.dash-cols{flex-direction:column}.dash-cols>.grow{width:100%}.dash-side{width:100%!important;display:grid!important;grid-template-columns:1fr 1fr;align-items:start}}
@media (max-width:1399px){.c-last{display:none!important}}
/* Prototype panel */
.proto{position:fixed;left:16px;bottom:112px;z-index:100;font-size:12px}
.proto-btn{background:var(--night);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:var(--lift)}
.proto-card{position:absolute;left:0;bottom:44px;width:300px;background:var(--night);color:#EDEDEA;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--lift-strong)}
.proto-card .o{color:#9C9B95}
.proto-card .seg{background:#2E2E2C}
.proto-card .seg button{color:#B5B4AE;font-size:12px;padding:5px 8px}
.proto-card .seg button.on{background:#4A4A47;color:#fff;box-shadow:none}
.proto-card .pbtn{background:#2E2E2C;border-radius:8px;padding:7px 10px;color:#fff;text-align:left;font-size:12px}
.proto-card .pbtn:hover{background:#3A3A38}

/* Lesson / video */
.video{aspect-ratio:16/8.2;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(135deg,#3B2FA0 0%,#5B47E0 55%,#8C7BF0 100%);color:#fff}
.video .vbar{position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:center;gap:12px}
.vtrack{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.3);cursor:pointer;position:relative}
.vtrack b{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#fff}
.vtrack .m90{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.7);left:90%}
.bigplay{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--ink-violet)}
.celebrate{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}

/* Calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--sheet)}
.day{border-right:1px solid var(--rule);min-height:420px;display:flex;flex-direction:column}
.day:last-child{border-right:0}
.dayhead{padding:12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.day.today .dayhead{background:var(--violet-wash)}
.ev{margin:8px 8px 0;padding:8px 10px;border-radius:8px;background:var(--margin);display:flex;flex-direction:column;gap:2px;text-align:left}
.ev:hover{filter:brightness(.97)}
.ev.class{background:var(--violet-wash)}
.ev.dl{background:var(--highlighter-wash)}
.ev.over{background:var(--red-wash)}
.ev.done{opacity:.55}

/* Messages */
.msgs{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 160px);min-height:520px}
.conv{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.conv.on{background:var(--violet-wash)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--ink-violet);flex:none;margin-top:6px}
.bubble{max-width:70%;padding:10px 14px;border-radius:14px;background:var(--margin);font-size:14px;line-height:20px}
.bubble.me{background:var(--ink-violet);color:#fff;margin-left:auto}
/* ===== ADMIN V2 CSS START ===== */
/* Editors and screens added on 01.10 (course, lesson, activities, report result, notifications) */
.edhead{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:14px 40px}
.ed-cols{display:flex;gap:28px;align-items:flex-start}
.ed-side{width:320px;flex:none;position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
.note{display:flex;gap:10px;background:var(--margin);border-radius:10px;padding:12px 14px;align-items:flex-start}
.chk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.chk.ok{background:var(--approved)}.chk.warn{background:var(--highlighter-wash);color:var(--highlighter)}
.media{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.thumb{width:112px;height:63px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff}
.ol{overflow:hidden}
.ol-mod{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-top:1px solid var(--rule)}
.ol-mod:first-child{border-top:0}
.ol-mod:hover{background:#FAFAF8}.ol-mod.open{background:var(--margin)}
.ol-item{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 52px;border-top:1px solid var(--rule);cursor:pointer}
.ol-item:hover{background:#FAFAF8}
.ol-item.act{padding-left:88px}
.grip{color:var(--pencil-faded);cursor:grab;display:grid;place-items:center;flex:none}
.numtile{width:28px;height:28px;border-radius:8px;background:var(--margin);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--pencil);flex:none}
.numtile.on{background:var(--violet-wash);color:var(--ink-violet-deep)}
.ol-mod.open .numtile:not(.on){background:var(--sheet)}
.typeicon.sm{width:30px;height:30px;border-radius:8px}
.addrow{display:flex;align-items:center;gap:8px;padding:10px 16px 10px 52px;color:var(--ink-violet-deep);font-size:13px;font-weight:500;width:100%;text-align:left;border-top:1px solid var(--rule)}
.addrow.act{padding-left:88px;border-top:0}
.addrow:hover{background:#FAFAF8}
.evchip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;border-radius:8px;background:var(--margin)}
.block{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.block-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.block-b{padding:0 12px 12px 34px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--rule-strong);border-radius:8px;font-size:13px;background:var(--sheet)}
.chipbtn:hover{background:var(--margin)}
.menu .mi.tall{align-items:flex-start;padding:10px 14px;gap:12px}
.iconbtn.ghost{border-color:transparent;background:none}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);width:400px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--lift-strong);z-index:20;overflow:hidden;text-align:left}
.nitem{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.nitem.unread{background:var(--violet-wash)}
.ro{background:var(--margin);color:var(--ink)}
/* Activity editors */
.qlist{width:330px;flex:none}
.qitem{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-top:1px solid var(--rule);cursor:pointer;text-align:left;width:100%}
.qitem:hover{background:#FAFAF8}
.qitem.on{background:var(--violet-wash)}
.ans{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--sheet)}
.ans.ok{border-color:var(--approved);background:var(--approved-wash)}
.ans input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--rule-strong);background:var(--sheet);flex:none;display:grid;place-items:center;cursor:pointer}
.radio.on{border-color:var(--approved)}.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--approved)}
.sq{border-radius:4px}.sq.on{background:var(--approved);color:#fff}.sq.on::after{display:none}
.stmt{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-top:1px solid var(--rule)}
.stmt.on{background:var(--margin)}
.wd{display:inline-block;padding:2px 3px;border-radius:5px;cursor:pointer;line-height:24px}
.wd:not(.gap){margin:0 -3px}
.gapchip{display:inline-block;padding:0 8px;border-radius:6px;background:var(--violet-wash);color:var(--ink-violet-deep);font-weight:500;line-height:24px}
.gapchip .wd{padding:0 3px}
.gapchip .wd:hover{background:none;text-decoration:underline}
.wd:hover{background:var(--margin)}
.wd.sel{background:var(--ink-violet);color:#fff}
.wd.gap{background:var(--violet-wash);color:var(--ink-violet-deep);font-weight:500;padding:2px 8px}
.blank{display:inline-block;width:96px;height:24px;border:1px solid var(--rule-strong);border-radius:6px;vertical-align:middle;background:var(--sheet)}
.acc{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule-strong);font-size:12px;font-weight:500}
/* Report result */
.chartrow{display:grid;grid-template-columns:120px 1fr 28px;gap:12px;align-items:center}
.chartbar{height:14px;border-radius:4px;background:var(--rule-strong)}
.chartbar.top{background:var(--ink-violet)}
.colpanel{width:280px;flex:none;border-left:1px solid var(--rule);background:var(--sheet);padding:20px;display:flex;flex-direction:column;gap:16px;align-self:stretch}
/* account block instead of the always-on role switch; progress chips on the learner dashboard */
.acct{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 6px;border-top:1px solid var(--rule);width:100%;border-radius:0}
.acct:hover{background:var(--margin)}
.proto{bottom:78px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font-size:13px;line-height:18px;font-weight:500;white-space:nowrap}
a.chip:hover,button.chip:hover{background:var(--margin)}
/* sidebar rail */
.app.collapsed{grid-template-columns:68px 1fr}
.side.rail{padding:16px 10px;align-items:center}
.side.rail .nav{justify-content:center;padding:9px;width:44px;position:relative}
.side.rail .nav .badge-n{position:absolute;top:0;right:-4px;margin:0;padding:0 5px;font-size:10px;line-height:14px}
.side.rail .acct{justify-content:center;padding:12px 0 6px}
.nav-collapsed .proto-btn .lbl{display:none}
.nav-collapsed .proto-btn{padding:8px 10px}
/* fixed and offset by the sidebar, the bar had less room than its labels and wrapped them; keep each label on 1 line */
.bulkbar{white-space:nowrap}
.nav-collapsed .bulkbar{left:calc(50% + 34px)}
.side .tip[data-tip]:hover::after{left:auto;right:0}
/* app bar on every screen: back / forward on the left, search and notifications on the right */
/* the app bar stays on top while the page scrolls; editor headers stick right under it */
.appbar{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 40px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:7}
.main{scroll-padding-top:72px}
.edhead,.main>[style*="position:sticky;top:0"]{top:64px!important}
.ed-side{top:160px}
#ev-side{top:168px!important}
.navhist{display:flex}
.side:not(.rail){padding-top:16px} /* logo row centred on the app bar */
.appbar .iconbtn:disabled{color:var(--pencil-faded);cursor:default}
.appbar .iconbtn:disabled:hover{background:none}
.overbar.amber{background:var(--highlighter)}
.count.amber{background:var(--highlighter-wash);color:var(--highlighter)}
/* search results under the top bar search */
.searchwrap{position:relative}
.sbox{display:none;position:absolute;right:0;top:calc(100% + 8px);width:420px;max-width:calc(100vw - 24px);max-height:min(480px,70vh);overflow-y:auto;padding-bottom:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--lift-strong);z-index:25;text-align:left}
.searchwrap.open .sbox{display:block}
.sitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px}
.sitem:hover,.sitem.on{background:var(--margin)}
/* breadcrumbs are the way up in editors (no separate back button) */
.crumb{display:inline;color:inherit;font:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.crumb:hover{color:var(--ink);text-decoration:underline}
.menu{z-index:110}
/* review status steps (from Scale): a soft strip, done = green, now = violet, next = hollow */
.steps{list-style:none;margin:0;padding:14px 16px;border-radius:10px;background:var(--margin);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps li{display:flex;gap:10px;align-items:flex-start;min-width:0}
.steps .sdot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;border:2px solid var(--rule-strong);background:var(--sheet)}
.steps li.done .sdot{background:var(--approved);border-color:var(--approved)}
.steps li.now .sdot{background:var(--ink-violet);border-color:var(--ink-violet)}
/* learner tasks board (from Scale) */
.tboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.tcol{background:var(--margin);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcol-h{padding:4px 4px 2px}
.tcount{font-size:12px;line-height:16px;font-weight:500;color:var(--pencil);background:var(--sheet);border-radius:999px;padding:1px 8px}
.tcard{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;cursor:pointer;transition:border-color .15s}
.tcard:hover{border-color:var(--rule-strong)}
.cdot{width:8px;height:8px;border-radius:50%;flex:none}
@media (max-width:767px){.tboard{grid-template-columns:minmax(0,1fr)}}
/* ===== Responsive: the page works from 1440 down to a phone ===== */
body,.app{min-width:0!important}
.narrow{display:none!important}
#app{height:100%!important;overflow-x:hidden}
.main{min-width:0}
.app.mobile{grid-template-columns:minmax(0,1fr)}
.side.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:86vw;z-index:95;box-shadow:var(--lift-strong);animation:drawerin .22s var(--ease)}
.drawer-scrim{position:fixed;inset:0;background:rgba(26,26,25,.35);z-index:94;animation:fadein .2s}
@keyframes drawerin{from{transform:translateX(-100%)}to{transform:none}}
.nav-mobile .bulkbar{left:50%}
.nav-mobile .proto{bottom:16px}
.nav-mobile .proto-btn .lbl{display:none}
.nav-mobile .proto-btn{padding:8px 10px}
.drawer-open .proto{display:none}
.dropdown{max-width:calc(100vw - 24px)}
.dialog{max-width:calc(100vw - 32px)}
.rpanel{max-width:100%}
/* learner dashboard under 1440: Continue learning across the top, then This week | My courses and Contacts as 2 halves (1 column under 1000) */
@media (min-width:1000px) and (max-width:1439px){
 .dash-cols{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
 .dash-cols>.grow{display:contents}
 .dash-cols>.grow>:first-child{grid-column:1/-1}
 .dash-side{display:flex!important;flex-direction:column;align-items:stretch;gap:24px;min-width:0}
}
@media (max-width:999px){.dash-side{grid-template-columns:minmax(0,1fr)!important}}
/* a week row that gets narrow puts the due date and the button on a second line */
section.card:has(.wl-row){container-type:inline-size}
@container (max-width:620px){

 .wl-row>.grow{flex:1 1 calc(100% - 50px)}
 .wl-due{margin-left:50px;flex:1 1 auto}
}

@media (max-width:999px){
 .main [style*="grid-template-columns:minmax(0,1fr) 340px"],.main [style*="grid-template-columns:minmax(0,1fr) 360px"]{grid-template-columns:minmax(0,1fr)!important}
 .row:has(>#ev-side),.row:has(>[style*="width:320px;flex:none"]),.row:has(>[style*="width:300px;flex:none"]),.row:has(>.qlist){flex-direction:column!important;align-items:stretch!important}
 #ev-side,.row>[style*="width:320px;flex:none"],.row>[style*="width:300px;flex:none"]{width:auto!important;position:static!important}
 .ed-cols{flex-direction:column;align-items:stretch}
 .ed-side{width:auto;position:static}
 .qlist{width:auto}
 .colpanel{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(320px,100%);overflow:auto;box-shadow:var(--lift-strong)}
 .msgs{grid-template-columns:240px minmax(0,1fr)}
 .msgs .row.gap12[style*="margin:16px 20px 0"]{flex-wrap:wrap;row-gap:10px}
 .msgs .row.gap12[style*="margin:16px 20px 0"]>.grow{flex:1 1 180px}
 .tabs{overflow-x:auto;scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tab{flex:none}
 .row:has(>[aria-label="Your progress"]){flex-wrap:wrap;row-gap:12px}
 .row:has(>[aria-label="Your progress"])>.grow{flex:1 1 360px}
 /* review queue: below 1000 px each row is a 2-line card (title + status, then student + waiting time) */
 .tbl:has(>.tr[data-act="open"])>.tr.head{display:none}
 .tbl:has(>.tr[data-act="open"])>.tr{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto 36px;grid-template-areas:"cb sub sub st act" ". who when when .";height:auto;min-width:0;padding:12px 4px 12px 0;row-gap:6px;align-items:center}
 .tr>[data-k]{width:auto!important;padding:0 8px}

 .tr>[data-k="Submission"]{grid-area:sub}
 .tr>[data-k="Student"]{grid-area:who}
 .tr>[data-k="Status"]{grid-area:st;justify-content:flex-end}
 .tr>[data-k="Submitted"]{grid-area:when;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important}
 .tr>[data-k="act"]{grid-area:act}
 .tr>[data-k="Reviewer"],.tr>[data-k="Last activity"]{display:none!important}
}
@media (max-width:767px){
 .page{padding:16px 16px 96px;gap:16px}
 .h1{font-size:24px;line-height:30px}
 .appbar{padding:0 12px;gap:6px}
 .appbar>.grow{display:none}
 .appbar .searchwrap{flex:1 1 auto;min-width:0}
 .appbar .search{width:100%;min-width:0}
 .sbox{position:fixed;left:12px;right:12px;top:60px;width:auto}
 .appbar .kbd{display:none}
 .edhead{padding:12px 16px;flex-wrap:wrap;row-gap:10px}
 .edhead,.main>[style*="position:sticky;top:0"]{position:static!important}
 .edhead>.col.grow{flex:1 1 100%}
 .msgs{grid-template-columns:minmax(0,1fr);height:auto}
 .week{grid-template-columns:minmax(0,1fr)}
 .day{min-height:0;border-right:0;border-bottom:1px solid var(--rule)}
 .dropdown{position:fixed;left:12px;right:12px;top:60px;width:auto}
 .bulkbar{left:12px!important;right:12px;transform:none;overflow-x:auto}
 .toast{max-width:calc(100vw - 24px)}
 .page label.input[style*="width:280px"],.page label.search[style*="width"]{width:100%!important}
 [aria-label="Your progress"],.page>.row.gap8,.row.gap12:has(>.btn),.row.gap8:has(>.btn){flex-wrap:wrap}
 .card .row.between{flex-wrap:wrap;row-gap:8px}
 .row:has(>.field){flex-direction:column!important;align-items:stretch!important}
 .field label.input,.field label.input>select,.field label.input>input{min-width:0;width:100%}
 section.card.row:has(>a>.cover){flex-direction:column;align-items:stretch;gap:16px}
 section.card.row>a>.cover{width:100%!important;height:150px!important}
 /* review panel full screen: no keyboard hints, grade wraps instead of squeezing */
 .rp-top{padding:12px 16px}
 .rp-body{padding:16px}
 .rp-foot{padding-left:16px!important;padding-right:16px!important}
 .rp-foot .row.gap12{flex-wrap:wrap;row-gap:10px}
 .rp-foot label.input{flex:none}
 .rp-foot .row.gap8>.grow:has(.kb){display:none}
 .rp-foot .row.gap8{justify-content:flex-end}
 .rpanel .row.gap8.s>.med{white-space:nowrap}
 /* Create event header: title on its own line, actions under it */
 .main>.row.gap16>.row.gap16[style*="padding:16px 40px"]{flex-wrap:wrap;row-gap:10px;padding:12px 16px!important}
 .main>.row.gap16>.row.gap16[style*="padding:16px 40px"]>.col.grow{flex:1 1 100%}
 /* Messages: list first, a conversation opens on its own screen with a way back to the list */
 .msgs>:first-child{border-right:0!important}
 .msgs:not(.show-thread)>.col{display:none}
 .msgs.show-thread>:first-child{display:none}
 .steps{grid-template-columns:minmax(0,1fr)}
 .livecard{flex-wrap:wrap;row-gap:10px}
 .livecard>.grow{flex:1 1 calc(100% - 52px)}
 .livecard>.grow+*{margin-left:52px}
 .dropzone{display:block;text-align:center}
 .dropzone>svg{display:inline-block;vertical-align:-3px;margin-right:4px}
 .pad24.row.gap24{flex-wrap:wrap}
 .pad24.row.gap24>.grow{flex:1 1 100%}
 .media,.filerow{flex-wrap:wrap}
 .media>.grow,.filerow>.grow{flex:1 1 160px}
 .card>.row.gap16[style*="padding:14px 20px"]{flex-wrap:wrap;row-gap:8px;padding:14px 16px!important}
 .card>.row.gap16[style*="padding:14px 20px"]>.grow{flex:1 1 calc(100% - 56px)}
 .card>.row.gap16[style*="padding:14px 20px"]>.grow+*{margin-left:56px}
 /* list items with an action (admin home): the action moves under the text */
 .card>.row.gap12[style*="padding:16px 20px"]{flex-wrap:wrap;row-gap:10px;padding:14px 16px!important}
 .card>.row.gap12[style*="padding:16px 20px"]>.grow{flex:1 1 calc(100% - 52px)}
 .card>.row.gap12[style*="padding:16px 20px"]>.grow+*{margin-left:52px}
 .tbl:has(>.tr[data-act="open"])>.tr{grid-template-columns:40px minmax(0,1fr) auto 36px;grid-template-areas:"cb sub sub act" ". who st st" ". when when when"}
}
/* batch D: live class preparation, deadline reminder, finished course */
.wl-row .prep{color:var(--ink);align-items:flex-start;margin-top:2px}
.wl-row .prep .link,.livecard .prep .link{display:inline}
.livecard .prep{color:var(--ink);align-items:flex-start;margin-top:2px}
.remline{align-items:flex-start;margin-top:6px}
.remline svg,.prep svg{flex:none;margin-top:2px}
.cert{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:28px 28px 24px;border:1px solid var(--rule);border-radius:12px;background:var(--paper)}
/* the course colour is a straight band clipped by the corners, as in Figma, not a thick border that bends round them */
.cert::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--cert,var(--ink-violet))}

 .mcrow>.grow{flex:1 1 0;min-width:0}

 .mcrow>.mcprog{width:calc(100% - 72px)!important}
}

/* badges as medals: the newest one large, then a grid; the next one grey with a progress ring */

.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.medal-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:24px 16px 20px}

.av36{width:36px;height:36px;font-size:13px;font-weight:600}.av40{width:40px;height:40px;font-size:13px;font-weight:600}
.msgs{grid-template-columns:360px minmax(0,1fr);height:min(820px,calc(100vh - 172px))}

.mlist-top .input{height:36px}
.mtabs{border-bottom:0;gap:16px}
.mrows{flex:1;overflow:auto;min-height:0}
.msgs .conv{border-bottom:0;padding:12px 16px;align-items:flex-start;gap:12px}
.msgs .conv:hover{background:#FAFAF8}.msgs .conv.on{background:var(--violet-wash)}

function currentLesson(){const r=route();return LESSONS.find(x=>x.id===r.id)||LESSONS.find(x=>x.id==='ux5');}
function setWatched(l,v){l.watched=Math.min(100,v);const f=document.getElementById('vfill'),t=document.getElementById('vtime');if(f)f.style.width=l.watched+'%';
 const sec=Math.round(l.min*60*l.watched/100);if(t)t.textContent=`${Math.floor(sec/60)}:${pad2(sec%60)} / ${l.min}:00`;
 if(l.watched>=90&&!l.done)completeLesson(l);}
function completeLesson(l){l.done=true;st.completedFlash=l.id;const ml=courseLessons(l.course).filter(x=>x.mod===l.mod);
 if(ml.every(x=>x.done)){const C=COURSES[l.course];const doneMods=C.modules.filter((_,mi)=>{const xs=courseLessons(l.course).filter(x=>x.mod===mi);return xs.length&&xs.every(x=>x.done);}).length;
  st.celebrate={lesson:l.id,done:doneMods,from:Math.round((doneMods-1)/C.modules.length*100),to:Math.round(doneMods/C.modules.length*100)};}
 stopPlay();render();}
function stopPlay(){st.playing=false;clearInterval(playTimer);playTimer=null;}
ACT.playpause=()=>{const l=currentLesson();if(st.playing){stopPlay();render();return;}if(l.done)l.watched=0;st.playing=true;render();
 playTimer=setInterval(()=>{if(route().view!=='lesson'){stopPlay();return;}setWatched(l,l.watched+1);},110);};
ACT.scrub=(el,e)=>{const l=currentLesson();const r=el.getBoundingClientRect();setWatched(l,Math.round((e.clientX-r.left)/r.width*100));};
ACT['undo-complete']=(el)=>{const l=LESSONS.find(x=>x.id===el.dataset.id);l.done=false;l.watched=80;st.completedFlash=null;st.celebrate=null;render();};
AFTER.push(r=>{if(r.view==='lesson'&&st.celebrate){const b=document.querySelector('.celebrate .bar b');if(b){requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.width=st.celebrate.to+'%';}));}}});

/* --- filters --- */
function fLabel(k){const f=st.filters;
 if(k==='course'&&f.course.length)return ('Course: '+COURSES[f.course[0]].title)+(f.course.length>1?` +${f.course.length-1}`:'');
 if(k==='module'&&f.module.length){const[c,m]=f.module[0].split(':');return 'Module: M'+(+m+1)+' '+MODS[c][m]+(f.module.length>1?` +${f.module.length-1}`:'');}
 if(k==='reviewer'&&f.reviewer.length)return 'Reviewer: '+f.reviewer[0]+(f.reviewer.length>1?` +${f.reviewer.length-1}`:'');
 if(k==='submitted'&&f.submitted)return 'Submitted: '+{today:'today','2d':'last 2 days','7d':'last 7 days'}[f.submitted];
 if(k==='student'&&f.student)return 'Student: '+f.student;
 return {course:'Course',module:'Module',reviewer:'Reviewer',submitted:'Submitted',student:'Student'}[k];}
function filterBtn(k){const on=fLabel(k)!=={course:'Course',module:'Module',reviewer:'Reviewer',submitted:'Submitted',student:'Student'}[k];
 const dis=k==='module'&&!st.filters.course.length;
 return `<button class="btn btn-secondary btn-sm ${dis?'tip':''}" ${dis?'data-tip="Choose a course first" aria-disabled="true" style="opacity:.5"':''} data-act="${dis?'noop':'filter'}" data-k="${k}" style="${on?'background:var(--violet-wash);border-color:var(--ink-violet);color:var(--ink-violet-deep)':''};font-weight:${on?600:400}">${esc(fLabel(k))}${ic('down',14)}</button>`;}
function filterChips(demo){if(demo&&!filtersActive())return ['Course: Figma: Advanced Prototyping','Submitted: last 7 days','Student: "Kovalen"'].map(t=>`<span class="pill">${esc(t)}${ic('x',12)}</span>`).join('');
 return ['course','module','reviewer','submitted','student'].filter(k=>fLabel(k)!=={course:'Course',module:'Module',reviewer:'Reviewer',submitted:'Submitted',student:'Student'}[k]).map(k=>`<button class="pill" data-act="clearf" data-k="${k}">${esc(fLabel(k))}${ic('x',12)}</button>`).join('');}
ACT.noop=()=>{};
ACT.filter=(el)=>{const k=el.dataset.k,f=st.filters;let h='';
 const opt=(label,on,data,extra='')=>`<button class="mi" data-act="fopt" data-keepmenu ${data}>${cbx(on,false,'')}<span class="grow trunc">${esc(label)}</span>${extra}</button>`;
 const countIn=fn=>ALLSUBS.filter(s=>inTab(s,st.tab)&&fn(s)).length;
 if(k==='course'){const sel=f.course;
  h=`<div style="padding:4px 10px 6px"><label class="input" style="height:34px">${ic('search',14)}<input id="fsearch" placeholder="Search 42 courses"></label></div>`+
   (sel.length?`<div class="mgroup o faded">Selected · ${sel.length}</div>`+sel.map(c=>opt(COURSES[c].title,true,`data-k="course" data-v="${c}"`,`<span class="c faded">${countIn(s=>s.course===c)}</span>`)).join(''):'')+
   `<div class="mgroup o faded">All courses</div><div id="flist" style="max-height:260px;overflow:auto">`+
   ['ux','fig','pa'].filter(c=>!sel.includes(c)).map(c=>opt(COURSES[c].title,false,`data-k="course" data-v="${c}" data-name="${esc(COURSES[c].title.toLowerCase())}"`,`<span class="c faded">${countIn(s=>s.course===c)}</span>`)).join('')+
   OTHER_COURSES.map(n=>`<button class="mi" data-name="${esc(n.toLowerCase())}" data-act="notyet" data-msg="No submissions in this course">${cbx(false,false,'')}<span class="grow trunc">${esc(n)}</span><span class="c faded">0</span></button>`).join('')+`</div>`+
   `<div class="row between" style="padding:8px 12px 2px;border-top:1px solid var(--rule)"><button class="link" style="color:var(--pencil)" data-act="clearf" data-k="course">Clear</button><span class="c faded">Applied instantly · ${queueList().length} results</span></div>`;
  openMenu(el,h,'filter',{w:340});setTimeout(()=>{const i=document.getElementById('fsearch');i&&i.focus();},0);return;}
 if(k==='module'){h=f.course.map(c=>`<div class="mgroup o faded">${esc(COURSES[c].title)}</div>`+MODS[c].map((m,i)=>opt(`M${i+1} ${m}`,f.module.includes(c+':'+i),`data-k="module" data-v="${c}:${i}"`,`<span class="c faded">${countIn(s=>s.course===c&&s.mod===i)}</span>`)).join('')).join('');openMenu(el,h,'filter',{w:300});return;}
 if(k==='reviewer'){h=[...REVIEWERS,'Unassigned'].map(r=>opt(r,f.reviewer.includes(r),`data-k="reviewer" data-v="${r}"`,`<span class="c faded">${countIn(s=>(s.reviewer||'Unassigned')===r)}</span>`)).join('');openMenu(el,h,'filter');return;}
 if(k==='submitted'){h=[['today','Today'],['2d','Last 2 days'],['7d','Last 7 days'],['','Any time']].map(([v,l])=>`<button class="mi" data-act="fopt" data-k="submitted" data-v="${v}">${(f.submitted||'')===v?ic('check',14,'violet'):'<span style="width:14px"></span>'}${l}</button>`).join('');openMenu(el,h,'filter',{w:200});return;}
 if(k==='student'){const names=[...new Set(ALLSUBS.filter(s=>inTab(s,st.tab)).map(s=>s.student))].sort();
  h=`<div style="padding:4px 10px 6px"><label class="input" style="height:34px">${ic('search',14)}<input id="fsearch" placeholder="Search ${names.length} students"></label></div><div id="flist" style="max-height:280px;overflow:auto">`+
   names.map(n=>`<button class="mi" data-act="fopt" data-k="student" data-v="${esc(n)}" data-name="${esc(n.toLowerCase())}">${av(n,'av22')}<span class="grow trunc">${esc(n)}</span>${f.student===n?ic('check',14,'violet'):''}</button>`).join('')+'</div>';
  openMenu(el,h,'filter',{w:300});setTimeout(()=>{const i=document.getElementById('fsearch');i&&i.focus();},0);}
};
document.addEventListener('input',e=>{if(e.target.id==='fsearch')filterMenuSearch(e.target.value);});
window.filterMenuSearch=v=>{v=v.toLowerCase();document.querySelectorAll('#flist [data-name]').forEach(b=>b.style.display=b.dataset.name.includes(v)?'':'none');};
ACT.fopt=(el)=>{const k=el.dataset.k,v=el.dataset.v,f=st.filters;
 if(k==='submitted'){f.submitted=v||null;st.menu=null;}
 else if(k==='student'){f.student=f.student===v?'':v;st.menu=null;}
 else{const a=f[k];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);if(k==='course')f.module=f.module.filter(m=>f.course.includes(m.split(':')[0]));}
 st.page=1;st.sel.clear();render();
 if(st.menu===null)return; const btnEl=document.querySelector(`[data-act="filter"][data-k="${k}"]`);if(btnEl)ACT.filter(btnEl);};
ACT.clearf=(el)=>{const k=el.dataset.k;if(k==='submitted')st.filters.submitted=null;else if(k==='student')st.filters.student='';else{st.filters[k]=[];if(k==='course')st.filters.module=[];}st.menu=null;st.sel.clear();render();};
ACT.clearfilters=()=>{st.filters={course:[],module:[],reviewer:[],submitted:null,student:''};st.search='';if(st.qState==='noresults')st.qState='live';st.sel.clear();render();};
ACT.sort=(el)=>{openMenu(el,[['priority','Priority: overdue first'],['oldest','Oldest first'],['newest','Newest first']].map(([v,l])=>`<button class="mi" data-act="setsort" data-v="${v}">${(st.sort||'priority')===v?ic('check',14,'violet'):'<span style="width:14px"></span>'}${l}</button>`).join(''),'sort',{w:220});};
ACT.setsort=(el)=>{st.sort=el.dataset.v;st.menu=null;render();};
ACT.qtab=(el)=>{st.tab=el.dataset.v;st.page=1;st.keep=null;st.sel.clear();st.failure=null;st.panel=null;st.loadingUntil=Date.now()+350;render();setTimeout(render,360);};
ACT.retry=()=>{st.qState='loading';render();setTimeout(()=>{st.qState='live';render();},700);};
ACT.page=(el)=>{st.page=Math.max(1,st.page+(+el.dataset.d));render();};

/* --- selection & bulk --- */
ACT.sel=(el)=>{const id=el.dataset.id;st.sel.has(id)?st.sel.delete(id):st.sel.add(id);render();};
ACT.selpage=()=>{const rows=pageRows(queueList());const all=rows.every(s=>st.sel.has(s.id));rows.forEach(s=>all?st.sel.delete(s.id):st.sel.add(s.id));render();};
ACT.selall=()=>{queueList().forEach(s=>st.sel.add(s.id));render();};
ACT.clearsel=()=>{st.sel.clear();st.failure=null;ALLSUBS.forEach(s=>{if(s.result&&!s.result.ok)s.result=null;});render();};
function selected(){return ALLSUBS.filter(s=>st.sel.has(s.id));}
function countAssigned(r){return ALLSUBS.filter(s=>(s.status==='needs'||s.status==='resub')&&s.reviewer===r).length;}
ACT.bulkassign=(el)=>{openMenu(el,REVIEWERS.map(r=>`<button class="mi" data-act="doassign" data-v="${r}"><span class="grow">${RFULL[r]}</span><span class="c faded">${countAssigned(r)} assigned now</span></button>`).join('')+`<button class="mi" data-act="doassign" data-v="">Unassign</button>`,'bulkassign',{w:260,up:!el.closest('.alert')});};
ACT.bulkstatus=(el)=>{openMenu(el,`<button class="mi" data-act="bulkaccept">${ic('check',14)}Accept</button><button class="mi" data-act="noop" style="opacity:.5;cursor:default" title="Needs individual feedback">${ic('undo',14)}<span class="col"><span>Request changes</span><span class="c faded">Needs feedback for each – open them one by one</span></span></button><button class="mi" data-act="bulkback">${ic('inbox',14)}Back to Needs review</button>`,'bulkstatus',{w:300,up:true});};
ACT.bulkexport=()=>toast(`Exported ${st.sel.size} submissions as CSV (simulated)`);
ACT.bulkremind=()=>{const n=st.sel.size;st.dialog={html:`<h2 class="h2">Remind ${n} students?</h2><p class="m pencil" style="margin:0">They get an email: “Your reviewer is waiting for your next version” with a link to their feedback.</p><div class="row gap8" style="justify-content:flex-end">${btn('Cancel','secondary','data-act="dialog-close"')}${btn('Send '+n+' reminders','primary','data-act="doremind"')}</div>`};renderLayer();};
ACT.doremind=()=>{const n=st.sel.size;st.dialog=null;st.sel.clear();render();toast(`Reminders sent to ${n} students`);};
function runBulk(label,items,apply,done){st.menu=null;st.bulk={label,done:0,total:items.length};render();let i=0;
 const tick=()=>{if(i>=items.length){st.bulk=null;done();return;}apply(items[i]);i++;st.bulk.done=i;render();setTimeout(tick,230);};setTimeout(tick,200);}
ACT.doassign=(el)=>{const to=el.dataset.v||null;const items=selected();ALLSUBS.forEach(s=>{if(s.result)s.result=null;});
 const prev=items.map(s=>[s,s.reviewer]);const fails=[];
 runBulk(to?'Assigning':'Unassigning',items,s=>{
   if(s.withdrawable){s.status='withdrawn_pending';s.result={ok:false,text:'Withdrawn by student'};fails.push([s,'withdrawn']);s.status='needs';s.withdrawnNow=true;return;}
   if(to==='Marta K.'&&s.course==='pa'&&!st.marta){s.result={ok:false,text:'No course access'};fails.push([s,'access']);return;}
   s.reviewer=to;s.result={ok:true,text:to?'Assigned just now':'Unassigned just now'};},
  ()=>{st.sel=new Set(fails.map(f=>f[0].id));
   if(fails.length){st.failure={to,ok:items.length-fails.length,total:items.length,fails};}
   else{st.sel.clear();toast(`${to?'Assigned':'Unassigned'} ${items.length} ${to?'to '+RFULL[to].replace('Assign to me','you'):''}`,'Undo',()=>{prev.forEach(([s,r])=>{s.reviewer=r;s.result=null;});render();});}
   render();});};
ACT.martaaccess=()=>{st.marta=true;const retry=st.failure.fails.filter(f=>f[1]==='access').map(f=>f[0]);toast('Marta Koval now has access to Product Analytics for Designers');
 runBulk('Assigning',retry,s=>{s.reviewer='Marta K.';s.result={ok:true,text:'Assigned just now'};st.sel.delete(s.id);},()=>{st.failure.fails=st.failure.fails.filter(f=>f[1]!=='access');st.failure.ok+=retry.length;if(!st.failure.fails.length){st.failure=null;}render();});};
ACT.dismissfail=()=>{if(st.failure)st.failure.fails.forEach(([s,why])=>{if(why==='withdrawn')s.status='withdrawn';s.result=null;});st.failure=null;st.sel.clear();render();};
ACT.bulkaccept=()=>{const items=selected();const already=items.filter(s=>s.status==='accepted');const unread=items.filter(s=>s.unread&&s.status!=='accepted');
 st.bulkSkipUnread=true;st.menu=null;
 const draw=()=>{const skip=already.length+(st.bulkSkipUnread?unread.length:0);const n=items.length-skip;
  st.dialog={html:`<h2 class="h2">Accept ${n} submission${n===1?'':'s'}?</h2>
   <p class="m pencil" style="margin:0">You selected ${st.tab==='all'&&items.length===ALLSUBS.filter(live).length?'all '+items.length+' in “All”':items.length}. ${skip?`${skip} will be skipped: ${already.length} are already reviewed${unread.length&&st.bulkSkipUnread?` and ${unread.length} ${unread.length===1?'has':'have'} unread student replies`:''}.`:'None will be skipped.'}</p>
   <div class="alert" style="background:var(--highlighter-wash);align-items:flex-start">${ic('mail',16,'amber')}<span class="s">${n} students will get an email. Accepting can't be undone in bulk: you would have to reopen each one.</span></div>
   ${unread.length?`<label class="row gap8 s" style="cursor:pointer" data-act="toggleunread">${cbx(st.bulkSkipUnread,false,'')}Skip submissions that have unread student replies (${unread.length})</label>`:''}
   <div class="row gap8" style="justify-content:flex-end">${btn('Cancel','secondary','data-act="dialog-close"')}${btn('Accept '+n,'primary',`data-act="doaccept" ${n?'':'disabled'}`)}</div>`};renderLayer();};
 st._drawAccept=draw;draw();};
ACT.toggleunread=()=>{st.bulkSkipUnread=!st.bulkSkipUnread;st._drawAccept();};
ACT.doaccept=()=>{st.dialog=null;const items=selected().filter(s=>s.status!=='accepted'&&!(st.bulkSkipUnread&&s.unread));
 runBulk('Accepting',items,s=>{s.status='accepted';s.reviewedAt=new Date(NOW);s.reviewer=s.reviewer||'You';s.grade=s.grade||8;s.lastText='Accepted just now';if(s.assign)deliverFeedback(s,{decision:'accept',grade:8,works:'Meets the brief.',fix:''});},()=>{st.sel.clear();st.reviewedToday+=items.length;render();toast(`Accepted ${items.length}. Students will get an email.`);});};
ACT.bulkback=()=>{const items=selected();runBulk('Moving',items,s=>{s.status='needs';s.lastText='Moved back just now';},()=>{st.sel.clear();render();toast(`${items.length} moved back to Needs review`);});};
ACT.rowmenu=(el)=>{const id=el.dataset.id;openMenu(el,`<button class="mi" data-act="open" data-id="${id}">${ic('eye',14)}Open</button>${ro()?'':`<button class="mi" data-act="assignme" data-id="${id}">${ic('user',14)}Assign to me</button><button class="mi" data-act="sel" data-id="${id}">${ic('check',14)}Select</button>`}`,'rowmenu',{w:200});};
ACT.assignme=(el)=>{const s=ALLSUBS.find(x=>x.id===el.dataset.id);const prev=s.reviewer;s.reviewer='You';st.menu=null;render();toast('Assigned to you','Undo',()=>{s.reviewer=prev;render();});};

/* --- side panel --- */
function panelList(){return queueList();}
function openPanel(id){if(route().view!=='queue'){go('admin/queue');setTimeout(()=>openPanel(id),30);return;}const s=ALLSUBS.find(x=>x.id===id);if(!s)return;
 if(!inTab(s,st.tab)&&st.tab!=='all'){st.tab='needs';}s.fresh=false;st.panel=id;st.ptab='sub';st.menu=null;render();
 setTimeout(()=>{const r=document.querySelector(`.tr[data-id="${id}"]`);r&&r.scrollIntoView({block:'nearest'});},0);}
ACT.open=(el)=>openPanel(el.dataset.id);
ACT.pclose=()=>{const id=st.panel;st.panel=null;render();setTimeout(()=>{const r=document.querySelector(`.tr[data-id="${id}"]`);r&&r.focus();},0);};
ACT.pmove=(el)=>{const L=panelList();const i=L.findIndex(s=>s.id===st.panel);const n=L[i+(+el.dataset.d)];if(n)openPanel(n.id);};
ACT.ptab=(el)=>{st.ptab=el.dataset.v;render();};
ACT.decision=(el)=>{const d=draftOf(st.panel);d.decision=el.dataset.v;render();};
ACT.pexpand=()=>toast('Full-page review is not part of this prototype');
const draftOf=id=>st.draft[id]||(st.draft[id]={decision:null,grade:'',works:'',fix:''});
const canSend=d=>d.decision&&(d.works.trim()||d.fix.trim());
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.fb&&st.panel){const d=draftOf(st.panel);d[t.dataset.fb]=t.value;d.saved=false;const b=document.getElementById('sendnext');if(b)b.disabled=!canSend(d);}
 if(t.id==='qsearch'){st.search=t.value;st.page=1;render();const i=document.getElementById('qsearch');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}});
ACT.savedraft=()=>{draftOf(st.panel).saved=true;render();toast('Draft saved. Only you can see it.');};
ACT.pfill=()=>{if(!st.panel||ro()){toast('Open a submission in the review queue first');return;}const d=draftOf(st.panel);const sp=ALLSUBS.find(x=>x.id===st.panel),script=sp&&sp.task==='Interview script draft';Object.assign(d,{decision:'changes',grade:'6',works:script?'Clear goals and a good flow from easy to deep questions.':'Clear recruiting criteria and a realistic schedule for 5 sessions.',fix:script?'Move the warm-up questions to the start. Rewrite the 3 leading questions on page 2 (“Don’t you think…”) as open ones.':'Add 2 screener questions that exclude people who work in UX themselves. Say how you will thank participants.'});render();};
ACT['fill-review']=()=>{if(route().view!=='queue'){go('admin/queue');setTimeout(()=>{openPanel(annaSubId());setTimeout(ACT.pfill,40);},40);return;}if(!st.panel)openPanel(queueList()[0].id);setTimeout(ACT.pfill,30);};
function deliverFeedback(s,d){if(!s.assign)return;const a=ASSIGN[s.assign];a.status=d.decision==='accept'?'accepted':'changes';
 a.feedback={works:d.works.trim(),fix:d.fix.trim(),grade:d.grade||8,notes:[d.works,d.fix].filter(x=>x&&x.trim()).length,at:'15:10',attempt:a.attempt};a.feedbackSeen=false;}
ACT.send=()=>{const s=ALLSUBS.find(x=>x.id===st.panel),d=draftOf(s.id);if(!canSend(d))return;
 const L=panelList();const i=L.findIndex(x=>x.id===s.id);const next=L[i+1]||L[i-1];
 const snap={status:s.status,reviewer:s.reviewer,lastText:s.lastText,grade:s.grade,reviewedAt:s.reviewedAt,assign:s.assign&&JSON.parse(JSON.stringify(ASSIGN[s.assign],(k,v)=>k==='due'||k==='submittedAt'?undefined:v))};
 s.keepOver=isOverdue(s);s.status=d.decision==='accept'?'accepted':'changes';s.reviewer=s.reviewer||'You';s.reviewedAt=new Date(NOW);s.grade=+d.grade||null;s.lastText='You reviewed just now';(st.keep=st.keep||new Set()).add(s.id);
 deliverFeedback(s,d);delete st.draft[s.id];st.reviewedToday++;
 const stillThere=next&&inTab(next,st.tab)&&next.id!==s.id;
 st.panel=stillThere?next.id:'caught';st.ptab='sub';render();
 toast(`${d.decision==='accept'?'Accepted':'Changes requested'} · ${s.student} will get an email`,'Undo',()=>{Object.assign(s,{status:snap.status,reviewer:snap.reviewer,lastText:snap.lastText,grade:snap.grade,reviewedAt:snap.reviewedAt});
  if(s.assign){const a=ASSIGN[s.assign];a.status='waiting';a.feedback=null;}st.reviewedToday--;st.draft[s.id]=d;openPanel(s.id);},8000);};
function panelHTML(){
 if(st.panel==='caught')return `<aside class="rpanel"><div class="rp-top"><span class="s pencil grow">Needs review</span><button class="iconbtn sm" data-act="pclose" aria-label="Close">${ic('x',16)}</button></div><div class="rp-body" style="justify-content:center">${stateBlock('caught')}</div></aside>`;
 const s=ALLSUBS.find(x=>x.id===st.panel);if(!s)return '';const L=panelList();const i=L.findIndex(x=>x.id===s.id);
 const d=draftOf(s.id),od=isOverdue(s),done=s.status==='accepted'||s.status==='changes';const days=Math.floor(hoursSince(s.submitted)/24);
 const brief=s.assign?ASSIGN[s.assign].brief:['Follow the module brief','Submit 1 file or link','Add a note if something is unclear'];
 const tabs=[['sub','Submission'],['brief','Task brief'],['act','Activity · '+(s.attempt>1?3:2)]];
 let body='';
 if(st.ptab==='brief')body=`<ol class="col gap8 m" style="margin:0;padding-left:20px">${brief.map(b=>`<li>${esc(b)}</li>`).join('')}</ol>`;
 else if(st.ptab==='act')body=actLog(s);
 else body=`${s.note?`<div class="col gap6" style="background:var(--margin);border-radius:10px;padding:12px 14px"><span class="o faded">Note from student</span><span class="s">${esc(s.note)}</span></div>`:''}
  <div class="col" style="border:1px solid var(--rule);border-radius:10px;overflow:hidden"><div class="row gap12" style="background:var(--margin);height:170px;justify-content:center;align-items:flex-end;padding-top:16px">${[0,1,2].map(k=>`<div class="col gap6" style="width:120px;height:154px;background:var(--sheet);padding:14px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)">${[70,96,88,96,60,96,80,40].map((w,j)=>`<span style="height:4px;width:${w}px;border-radius:2px;background:${j===0&&k===0?'var(--pencil)':'var(--rule-strong)'}"></span>`).join('')}</div>`).join('')}</div>
   <div class="row gap10" style="padding:12px 14px;gap:10px">${ic('file',18,'pencil')}<span class="col gap2 grow"><span class="m med">${esc(s.file||'submission.pdf')}</span><span class="c faded">${esc(s.pages||'')}</span></span><button class="link" data-act="notyet" data-msg="The file viewer is not part of this prototype">Open</button><button class="faded" data-act="notyet" data-msg="Downloaded (simulated)">${ic('dl',16)}</button></div></div>`;
 const foot=ro()?`<div class="rp-foot"><div class="row gap8 s pencil">${ic('lock',14)}View only – you can read submissions and comments, but not grade or change status.</div></div>`:
  done?`<div class="rp-foot"><div class="row gap12"><span class="badge ${STATUS[s.status][0]}"><i></i>${STATUS[s.status][1]}${s.grade?` · ${s.grade}/10`:''}</span><span class="s pencil grow">by ${esc(s.reviewer||'You')} · ${fmtDay(s.reviewedAt||NOW)}</span></div>${s.status==='changes'?`<span class="s pencil">Resubmit by ${resubmitBy(s)}</span>`:''}</div>`:

 const c=document.getElementById('ev-count');if(c)c.textContent=e.short.length+' / 160';const t=document.getElementById('ev-title');if(t)t.textContent=e.title||'New event';}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.ev&&st.evDraft){st.evDirty=true;st.evDraft[t.dataset.ev]=t.value;
 if(['from','to','start','every','count','endDate'].includes(t.dataset.ev)){render();const i=document.querySelector(`[data-ev="${t.dataset.ev}"]`);if(i&&t.type!=='date'&&t.type!=='time'){i.focus();i.setSelectionRange(i.value.length,i.value.length);}return;}
 evRefresh();}});

function evStore(status){const e=st.evDraft;const out=JSON.parse(JSON.stringify(e));delete out._route;out.status=status;
 if(e.id){const i=EVENTS.findIndex(x=>x.id===e.id);EVENTS[i]=out;}else{out.id='e'+(EVENTS.length+1);EVENTS.unshift(out);e.id=out.id;}return out;}

const TOUR_KEY='learnly.tour.v1';
const tourSeen=()=>{try{return localStorage.getItem(TOUR_KEY)==='1';}catch(e){return false;}};

const TOUR_HINTS=[
 ['time','<b>Click 18:52</b> → Join on the student’s dashboard becomes active. It opens 10 min before the class.'],
 ['queue','<b>Click Empty, No results, Loading or Error</b> → the teacher’s review queue in that state.'],

function drawTour(){
 if(!st.tour||!st.proto||innerWidth<760)return;
 const card=document.querySelector('.proto-card');if(!card)return;
 const cols=card.querySelectorAll(':scope > .col'),btns=card.querySelectorAll(':scope > .pbtn');
 const T={time:cols[0],queue:cols[1],viewer:cols[2],fill:btns[0],reset:btns[1],acct:document.querySelector('.acct')};
 const wrap=document.createElement('div');wrap.className='tour';
 wrap.innerHTML=`<div class="tour-scrim" data-act="tourdone"></div><svg class="tour-arrows" aria-hidden="true"><defs><marker id="tourhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#fff"/></marker></defs></svg>
  <div class="tour-card tour-intro" role="dialog" aria-label="How the prototype controls work"><span class="m semi">Prototype controls</span><span class="s pencil">Shortcuts to states that are hard to reach by clicking. They are not part of the product.</span><span class="s pencil">To see these hints again, click ${ic('info',13)} next to ×.</span><div>${btn('Got it','primary','data-act="tourdone"')}</div></div>
  ${TOUR_HINTS.filter(([k])=>T[k]&&T[k].offsetWidth).map(([k,t])=>`<div class="tour-card" data-k="${k}"><span class="s">${t}</span></div>`).join('')}`;
 document.getElementById('layer').appendChild(wrap);
 const cr=card.getBoundingClientRect(),x=Math.round(cr.right+56),gap=10,minY=16,maxY=innerHeight-16;
 const H=[...wrap.querySelectorAll('.tour-card[data-k]')].map(h=>{const t=T[h.dataset.k].getBoundingClientRect();return {h,t,ty:Math.round(t.top+t.height/2),hh:h.offsetHeight};});
 // each hint opposite its target; push down to avoid overlap, then pull the column up if it runs past the bottom
 let y=minY;H.forEach(o=>{o.top=Math.max(y,o.ty-Math.round(o.hh/2));y=o.top+o.hh+gap;});
 let limit=maxY;for(let i=H.length-1;i>=0;i--){H[i].top=Math.min(H[i].top,limit-H[i].hh);limit=H[i].top-gap;}
 let paths='';
 H.forEach(o=>{o.h.style.left=x+'px';o.h.style.top=o.top+'px';const hy=o.top+Math.round(o.hh/2),x1=x-8,x2=Math.round(o.t.right+8);
  paths+=`<path d="M${x1} ${hy} C${x1-30} ${hy} ${x2+30} ${o.ty} ${x2} ${o.ty}" marker-end="url(#tourhead)"/>`;});
 wrap.querySelector('svg').insertAdjacentHTML('beforeend',paths);
 // the intro sits above the first hint; when there is no room, in a second column; on narrow screens, above the panel
 const intro=wrap.querySelector('.tour-intro'),iw=intro.offsetWidth,ih=intro.offsetHeight,first=H.length?H[0].top:Math.round(cr.top),it=first-ih-16;
 if(it>=minY){intro.style.left=x+'px';intro.style.top=it+'px';}
 else if(x+2*iw+24<=innerWidth-16){intro.style.left=(x+iw+24)+'px';intro.style.top=Math.max(minY,first)+'px';}
 else{intro.style.left=Math.round(cr.left)+'px';intro.style.top=Math.max(minY,Math.round(cr.top)-ih-16)+'px';}
}

/* Fill the gaps */
const PUNCT=/^[.,!?;:]+$/;
function gTokens(text){const out=[];String(text).split(/\s+/).filter(Boolean).forEach(w=>{const m=w.match(/^(.*?)([.,!?;:]+)$/);if(m&&m[1]){out.push(m[1]);out.push(m[2]);}else out.push(w);});return out;}
function gRange(toks,gap){if(!gap)return null;const g=gTokens(gap);for(let i=0;i<=toks.length-g.length;i++){if(g.every((w,k)=>toks[i+k]===w))return [i,i+g.length-1];}return null;}
const gJoin=toks=>toks.reduce((h,t,k)=>h+(k&&!PUNCT.test(t)?' ':'')+esc(t),'');
function gView(s,mode){const toks=gTokens(s.text),R=gRange(toks,s.gap);if(!R)return gJoin(toks);const after=toks.slice(R[1]+1);
 return gJoin(toks.slice(0,R[0]))+(R[0]?' ':'')+(mode==='blank'?'<span class="blank"></span>':`<span class="wd gap">${gJoin(toks.slice(R[0],R[1]+1))}</span>`)+(after.length&&!PUNCT.test(after[0])?' ':'')+gJoin(after);}
/* the gap is 1 chip even when it is 2 words; punctuation sits right after its word, as in the mockup */
function gEdit(a,s,i){const toks=gTokens(s.text),R=gRange(toks,s.gap),G=st.gsel&&st.gsel.a===a.id&&st.gsel.s===i?st.gsel:null;
 return toks.map((t,k)=>{const p=PUNCT.test(t);const sel=G&&k>=G.from&&k<=G.to;const w=p?esc(t):`<span class="wd ${sel?'sel':''}" data-act="gword" data-a="${a.id}" data-s="${i}" data-t="${k}">${esc(t)}</span>`;
  return (k&&!p?' ':'')+(R&&k===R[0]?'<span class="gapchip">':'')+w+(R&&k===R[1]?'</span>':'');}).join('');}
function gapsEd(a){const si=Math.min(a.sel||0,a.sentences.length-1);
 const editRow=(s,i)=>{if(s.edit||!s.text.trim())return `<div class="stmt on"><div class="row gap10"><span class="grip">${ic('grip',14)}</span><span class="c faded">${i+1}</span><label class="input grow"><input data-ed="act.${a.id}.sentences.${i}.text" value="${esc(s.text)}" placeholder="Type a sentence, for example: Use card sorting to see how people group menu items."></label>${btn('Done','secondary btn-sm',`data-act="gdone" data-a="${a.id}" data-i="${i}"`)}</div><span class="c faded" style="padding-left:46px">Then select the word learners should type and make it a gap.</span></div>`;
  const has=st.gsel&&st.gsel.a===a.id&&st.gsel.s===i;
  return `<div class="stmt on"><div class="row gap10" style="align-items:flex-start"><span class="grip" style="padding-top:6px">${ic('grip',14)}</span><span class="c faded" style="padding-top:6px">${i+1}</span><div class="col gap10 grow" style="min-width:0"><div class="row gap8">${btn('Make a gap','primary btn-sm',`data-act="gmake" data-a="${a.id}" data-i="${i}" ${has?'':'disabled'}`)}${s.gap?btn('Remove gap','ghost btn-sm',`data-act="gremove" data-a="${a.id}" data-i="${i}"`):''}<button class="link" style="margin-left:auto;color:var(--pencil)" data-act="gedit" data-a="${a.id}" data-i="${i}">Edit text</button></div>
   <div class="m" style="border:1px solid var(--ink-violet);box-shadow:0 0 0 1px var(--ink-violet);border-radius:8px;padding:6px 10px;background:var(--sheet);line-height:28px">${gEdit(a,s,i)}</div>
   ${s.gap?`<div class="row gap6" style="flex-wrap:wrap"><span class="c faded">Accepted answers:</span>${s.acc.map((x,k)=>`<span class="acc">${esc(x)}<button class="faded" data-act="gaccdel" data-a="${a.id}" data-i="${i}" data-k="${k}" aria-label="Remove ${esc(x)}">${ic('x',12)}</button></span>`).join('')}${st.gaccAdd===a.id+':'+i?`<label class="input" style="height:28px;width:170px"><input data-gacc="${a.id}:${i}" placeholder="Another answer · Enter"></label>`:`<button class="link" data-act="gaccadd" data-a="${a.id}" data-i="${i}">${ic('plus',12)}Add answer</button>`}</div>`:'<span class="c amber">Click a word (or 2 words next to each other), then “Make a gap”.</span>'}</div><button class="faded" data-act="gmore" data-a="${a.id}" data-i="${i}" aria-label="More for sentence ${i+1}">${ic('more',16)}</button></div></div>`;};
 const viewRow=(s,i)=>`<div class="stmt" data-act="gsel" data-a="${a.id}" data-i="${i}" style="cursor:pointer"><div class="row gap10" style="align-items:flex-start"><span class="grip" style="padding-top:4px">${ic('grip',14)}</span><span class="c faded" style="padding-top:4px">${i+1}</span><div class="col gap4 grow" style="min-width:0"><span class="m" style="line-height:26px">${gView(s)}</span><span class="c faded">${s.gap?'Accepted: '+s.acc.map(esc).join(', '):'No gap yet'}</span></div><button class="faded" data-act="gmore" data-a="${a.id}" data-i="${i}" aria-label="More for sentence ${i+1}">${ic('more',16)}</button></div></div>`;
 return `<div class="ed-cols"><section class="card grow" style="overflow:hidden;min-width:0"><div class="row between" style="padding:14px 16px"><h3 class="h3">Sentences · ${a.sentences.length}</h3><span class="c faded">Select a word, then “Make a gap”</span></div>
  ${a.sentences.map((s,i)=>i===si?editRow(s,i):viewRow(s,i)).join('')}

 <div class="ed-side"><section class="card pad col gap12"><div class="row gap8 s pencil">${ic('eye',16)}What learners see</div>${a.sentences.filter(s=>s.text.trim()&&!s.edit&&s.gap).map(s=>`<p class="m" style="margin:0;line-height:30px">${gView(s,'blank')}</p>`).join('')||'<span class="s faded">Sentences show here once they have a gap.</span>'}</section>
  ${sideNote('Learners type the missing words. Every accepted answer counts as correct; capital letters don’t matter.')}</div></div>`;}
ACT.gsel=(el)=>{const a=ACTS[el.dataset.a];a.sel=+el.dataset.i;st.gsel=null;st.gaccAdd=null;render();};
ACT.gword=(el)=>{const id=el.dataset.a,s=+el.dataset.s,k=+el.dataset.t;const G=st.gsel;
 if(G&&G.a===id&&G.s===s&&(k<G.from||k>G.to)&&Math.min(Math.abs(k-G.from),Math.abs(k-G.to))<=3)st.gsel={a:id,s,from:Math.min(G.from,k),to:Math.max(G.to,k)};
 else if(G&&G.a===id&&G.s===s&&G.from===k&&G.to===k)st.gsel=null;else st.gsel={a:id,s,from:k,to:k};render();};
ACT.gmake=(el)=>{const a=ACTS[el.dataset.a],i=+el.dataset.i,G=st.gsel;if(!G)return;const s=a.sentences[i];const toks=gTokens(s.text).slice(G.from,G.to+1).filter(t=>!PUNCT.test(t));const gap=toks.join(' ');s.gap=gap;s.acc=[gap.toLowerCase()];st.gsel=null;edSaving();render();};
ACT.gremove=(el)=>{const s=ACTS[el.dataset.a].sentences[+el.dataset.i];s.gap=null;s.acc=[];edSaving();render();};

ACT.gmore=(el)=>openMenu(el,`<button class="mi" data-act="gdel" data-a="${el.dataset.a}" data-i="${el.dataset.i}">${ic('trash',14)}Delete sentence</button>`,'gmore',{w:200});
